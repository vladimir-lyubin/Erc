<section class="card">
  <h2>Exchange Rate Calculator</h2>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <app-currency-select label="From" controlName="from" />
    <app-currency-select label="To" controlName="to" />
    <label>
      Date (optional)
      <input type="date" formControlName="date" />
    </label>
    <button type="submit" [disabled]="request.loading()">
      {{ request.loading() ? 'Calculating…' : 'Calculate' }}
    </button>
  </form>

  @if (request.error(); as err) {
    <p class="error">{{ err }}</p>
  }
</section>

@if (request.value(); as res) {
  <section class="card">
    <p class="muted">{{ res.from }} → {{ res.to }} on {{ res.date }}</p>
    <div class="result-value">{{ res.exchange | number: '1.4-10' }}</div>
    <p class="muted">
      Query counts — {{ res.from }}: {{ res.fromQueryCount }}, {{ res.to }}: {{ res.toQueryCount }}
    </p>
  </section>
}
