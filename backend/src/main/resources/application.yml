spring:
  application:
    name: exchange-rate-management
  datasource:
    url: jdbc:h2:file:./data/exchange;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.format_sql: true
  sql:
    init:
      mode: always
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.1}
          temperature: 0.2

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

# --- Application-specific configuration ---
app:
  # Fixer.io integration. Collected set is limited to the main currencies (EUR base + these symbols).
  fixer:
    base-url: https://data.fixer.io/api
    api-key: ${FIXER_API_KEY:}
    symbols: ${FIXER_SYMBOLS:USD,GBP,AED}
    # HTTP timeouts so a slow/hung Fixer response fails fast and triggers the retry below
    connect-timeout-ms: ${FIXER_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${FIXER_READ_TIMEOUT_MS:5000}
    # Declarative retry on transient network/timeout errors (see FixerRestClient @Retryable)
    max-attempts: ${FIXER_MAX_ATTEMPTS:3}
    retry-backoff-ms: ${FIXER_RETRY_BACKOFF_MS:500}
    retry-multiplier: ${FIXER_RETRY_MULTIPLIER:2}
  # Daily collection at 12:05 AM GMT
  scheduler:
    cron: "0 5 0 * * *"
    zone: "GMT"
  # Demo seeding of historical rates (Fixer free has no history endpoint)
  seed:
    enabled: ${APP_SEED_ENABLED:true}
    days: 30
  # Spread reference table (Appendix B). Base currency spread is 0%.
  spread:
    default-percent: 2.75
    groups:
      "3.25": [JPY, HKD, KRW]
      "4.50": [MYR, INR, MXN]
      "6.00": [RUB, CNY, ZAR]

# CORS for local Angular dev server (comma-separated values bind to a list)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:exchange}
    username: ${DB_USER:exchange}
    password: ${DB_PASSWORD:exchange}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
