spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=LEGACY
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  seed:
    enabled: false
  fixer:
    base-url: http://localhost:9999
    api-key: ""
    connect-timeout-ms: 500
    read-timeout-ms: 500
    max-attempts: 2
    retry-backoff-ms: 10
    retry-multiplier: 2
